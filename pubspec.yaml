name: naoty_app
description: Une application de bloc-notes moderne
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.0
  
  # Stockage
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  
  # Multimédia
  image_picker: ^1.0.5
  vibration: ^1.8.4
  permission_handler: ^11.0.1
  path_provider: ^2.1.5
  
  # Icônes
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/images/logo.jpg"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/